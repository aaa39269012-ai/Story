<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawan TV - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; color: #fff; min-height: 100vh; font-size: 13px; }

        /* LOGIN */
        #loginScreen {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, #1a1a2e, #16213e);
        }
        .login-box {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 35px 30px; text-align: center; width: 300px;
        }
        .login-box h1 { font-size: 1.6rem; color: #e50914; margin-bottom: 6px; }
        .login-box p { color: #666; margin-bottom: 20px; font-size: 0.8rem; }
        .login-box input {
            width: 100%; padding: 10px 15px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #fff;
            font-size: 1rem; margin-bottom: 12px; outline: none; text-align: center; letter-spacing: 4px;
        }
        .login-box input:focus { border-color: #e50914; }
        .btn-login {
            width: 100%; padding: 10px; background: #e50914; border: none;
            border-radius: 8px; color: #fff; font-size: 0.9rem; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: #e50914; margin-top: 8px; font-size: 0.78rem; display: none; }

        /* ADMIN PANEL */
        #adminPanel { display: none; }

        /* HEADER */
        .admin-header {
            background: #1a1a1a; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #e50914; position: sticky; top: 0; z-index: 100;
        }
        .admin-header h1 { color: #e50914; font-size: 1rem; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .firebase-status {
            display: flex; align-items: center; gap: 5px; padding: 4px 10px;
            border-radius: 20px; font-size: 0.68rem; font-weight: bold;
        }
        .firebase-status.connected { background: rgba(76,175,80,0.15); color: #4CAF50; border: 1px solid #4CAF50; }
        .firebase-status.connecting { background: rgba(255,193,7,0.15); color: #FFC107; border: 1px solid #FFC107; }
        .firebase-status.error { background: rgba(229,9,20,0.15); color: #e50914; border: 1px solid #e50914; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .btn-logout {
            padding: 5px 12px; background: #e50914; border: none;
            border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.75rem; font-weight: bold;
        }

        /* TABS */
        .admin-tabs { display: flex; border-bottom: 1px solid #222; background: #151515; }
        .tab-btn {
            flex: 1; padding: 10px; background: transparent; border: none;
            color: #666; cursor: pointer; font-size: 0.8rem; border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active { color: #e50914; border-bottom-color: #e50914; background: rgba(229,9,20,0.05); }

        .admin-content { padding: 12px; max-width: 900px; margin: 0 auto; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* FORM */
        .form-card {
            background: #1a1a1a; border: 1px solid #222;
            border-radius: 10px; padding: 14px; margin-bottom: 12px;
        }
        .form-card h2 { font-size: 0.85rem; color: #e50914; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #222; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .form-row-single { margin-bottom: 10px; }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { color: #888; font-size: 0.72rem; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 7px 10px; background: #111; border: 1px solid #2a2a2a;
            border-radius: 7px; color: #fff; font-size: 0.8rem; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #e50914; }

        /* EPISODES */
        .episodes-label { color: #888; font-size: 0.72rem; font-weight: bold; margin-bottom: 6px; display: block; }
        .episode-item {
            background: #111; border: 1px solid #222; border-radius: 7px;
            padding: 8px 10px; margin-bottom: 7px;
        }
        .episode-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;
        }
        .episode-header span { color: #e50914; font-size: 0.72rem; font-weight: bold; }
        .btn-remove-epi {
            padding: 2px 8px; background: transparent; border: 1px solid #333;
            border-radius: 4px; color: #888; cursor: pointer; font-size: 0.68rem; transition: all 0.2s;
        }
        .btn-remove-epi:hover { border-color: #e50914; color: #e50914; }

        .btn-add-epi {
            width: 100%; padding: 7px; background: transparent; border: 1px dashed #333;
            border-radius: 7px; color: #666; cursor: pointer; font-size: 0.75rem; transition: all 0.2s;
        }
        .btn-add-epi:hover { border-color: #e50914; color: #e50914; }

        .btn-submit {
            padding: 9px 22px; background: #e50914; border: none;
            border-radius: 7px; color: #fff; font-size: 0.82rem;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .btn-submit:hover { background: #c00; }
        .btn-submit.full { width: 100%; margin-top: 12px; }

        /* FILTER BAR */
        .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-btn {
            padding: 4px 12px; background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 15px; color: #888; cursor: pointer; font-size: 0.72rem; transition: all 0.2s;
        }
        .filter-btn.active { background: rgba(229,9,20,0.15); border-color: #e50914; color: #e50914; }

        /* STORIES GRID */
        .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

        .story-card-admin {
            background: #1a1a1a; border: 1px solid #222; border-radius: 10px;
            overflow: hidden; transition: border-color 0.2s;
        }
        .story-card-admin:hover { border-color: #e50914; }

        .card-poster-wrap { position: relative; }
        .story-poster-admin { width: 100%; height: 130px; object-fit: cover; display: block; }
        .story-poster-placeholder {
            width: 100%; height: 130px; background: #111;
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
        }
        .card-badge {
            position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.8);
            border: 1px solid #e50914; border-radius: 4px; padding: 2px 7px;
            font-size: 0.62rem; color: #e50914;
        }
        .card-stats {
            position: absolute; bottom: 5px; right: 5px; display: flex; gap: 5px;
        }
        .stat-badge {
            background: rgba(0,0,0,0.8); border-radius: 4px; padding: 2px 6px;
            font-size: 0.6rem; color: #ccc; display: flex; align-items: center; gap: 3px;
        }

        .story-info-admin { padding: 8px 10px; }
        .story-info-admin h3 { font-size: 0.82rem; margin-bottom: 4px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .story-epi-count { color: #666; font-size: 0.68rem; margin-bottom: 7px; }

        .story-actions { display: flex; gap: 6px; }
        .btn-edit, .btn-delete {
            flex: 1; padding: 5px; background: transparent;
            border-radius: 6px; cursor: pointer; font-size: 0.72rem; transition: all 0.2s;
        }
        .btn-edit { border: 1px solid #4CAF50; color: #4CAF50; }
        .btn-edit:hover { background: #4CAF50; color: #fff; }
        .btn-delete { border: 1px solid #e50914; color: #e50914; }
        .btn-delete:hover { background: #e50914; color: #fff; }

        /* MODAL */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
            padding: 18px; width: 90%; max-width: 580px; max-height: 88vh; overflow-y: auto;
        }
        .modal-box::-webkit-scrollbar { width: 4px; }
        .modal-box::-webkit-scrollbar-thumb { background: #e50914; border-radius: 2px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-header h2 { color: #e50914; font-size: 0.95rem; }
        .btn-close-modal {
            width: 28px; height: 28px; background: #222; border: none;
            border-radius: 50%; color: #fff; font-size: 1rem; cursor: pointer;
        }

        /* TOAST */
        .toast {
            position: fixed; bottom: 20px; right: 15px; padding: 10px 18px;
            border-radius: 8px; font-weight: bold; font-size: 0.8rem; z-index: 9999;
            opacity: 0; transform: translateY(10px); transition: all 0.3s;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #4CAF50; color: #fff; }
        .toast.error { background: #e50914; color: #fff; }

        .no-stories { text-align: center; padding: 40px; color: #444; grid-column: 1/-1; }
        .no-stories .icon { font-size: 3rem; margin-bottom: 10px; }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; gap: 8px; }
            .stories-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .admin-content { padding: 10px; }
        }
    </style>
</head>
<body>


<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-box">
        <h1>📺 Pawan TV</h1>
        <p>Admin Panel</p>
        <input type="password" id="passInput" placeholder="Password" maxlength="10">
        <button class="btn-login" onclick="checkLogin()">LOGIN</button>
        <p class="error-msg" id="errorMsg">❌ Wrong Password!</p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="admin-header">
        <h1>📺 Pawan TV Admin</h1>
        <div class="header-right">
            <div class="firebase-status connecting" id="firebaseStatus">
                <div class="status-dot"></div>
                <span>Connecting...</span>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('add', this)">➕ Add Story</button>
        <button class="tab-btn" onclick="switchTab('manage', this)">📋 Manage</button>
    </div>

    <div class="admin-content">

        <!-- ADD TAB -->
        <div id="tab-add" class="tab-content active">
            <div class="form-card">
                <h2>📁 Add New Story</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label>📂 Folder / APK Name</label>
                        <input type="text" id="storyFolder" placeholder="Action, Romance...">
                    </div>
                    <div class="form-group">
                        <label>📖 Story Name</label>
                        <input type="text" id="storyName" placeholder="Story ka naam">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🖼️ Poster URL</label>
                        <input type="text" id="storyPoster" placeholder="https://...poster.jpg">
                    </div>
                    <div class="form-group">
                        <label>📝 Description</label>
                        <input type="text" id="storyDesc" placeholder="Short description">
                    </div>
                </div>

                <span class="episodes-label">🎬 Episodes</span>
                <div id="episodesList"></div>
                <button class="btn-add-epi" onclick="addEpisode()">➕ Add Episode</button>

<button class="btn-submit" onclick="importArchiveEpisodes()">
📥 Import Archive.org Series
</button>

<br>

<button class="btn-submit" onclick="saveStory()">💾 Save Story</button>
            </div>
        </div>

        <!-- MANAGE TAB -->
        <div id="tab-manage" class="tab-content">
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" onclick="filterStories('all', this)">All</button>
            </div>
            <div class="stories-grid" id="storiesGrid"></div>
        </div>

    </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>✏️ Edit Story</h2>
            <button class="btn-close-modal" onclick="closeModal()">✕</button>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>📂 Folder Name</label>
                <input type="text" id="editFolder" placeholder="Folder name">
            </div>
            <div class="form-group">
                <label>📖 Story Name</label>
                <input type="text" id="editName" placeholder="Story name">
            </div>
        </div>
        <div class="form-row" style="margin-bottom:10px;">
            <div class="form-group">
                <label>🖼️ Poster URL</label>
                <input type="text" id="editPoster" placeholder="Poster URL">
            </div>
            <div class="form-group">
                <label>📝 Description</label>
                <input type="text" id="editDesc" placeholder="Description">
            </div>
        </div>

        <span class="episodes-label">🎬 Episodes</span>
        <div id="editEpisodesList"></div>
        <button class="btn-add-epi" onclick="addEditEpisode()">➕ Add Episode</button>
        <button class="btn-submit full" onclick="updateStory()">✅ Update Story</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, serverTimestamp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCnCCWVcNhFBTCh7Tu9ctQ7QiGasUvgw4s",
        authDomain: "kuku-1cb36.firebaseapp.com",
        projectId: "kuku-1cb36",
        storageBucket: "kuku-1cb36.firebasestorage.app",
        messagingSenderId: "1089968385102",
        appId: "1:1089968385102:web:bf53c0b9b05c5659e3671f",
        measurementId: "G-FPTKTH9QXT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASS = '78626';
    let editingDocId = null;
    let episodeCount = 0;
    let editEpisodeCount = 0;
    let allStories = [];

    function setStatus(type, msg) {
        const el = document.getElementById('firebaseStatus');
        el.className = `firebase-status ${type}`;
        el.innerHTML = `<div class="status-dot"></div><span>${msg}</span>`;
    }

    // LOGIN
    window.checkLogin = function() {
        const pass = document.getElementById('passInput').value;
        if (pass === ADMIN_PASS) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            initFirestore();
            addEpisode();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('passInput').value = '';
            setTimeout(() => { document.getElementById('errorMsg').style.display = 'none'; }, 3000);
        }
    };

    document.getElementById('passInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') window.checkLogin();
    });

    window.logout = function() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('passInput').value = '';
    };

    // FIRESTORE
    function initFirestore() {
        setStatus('connecting', 'Connecting...');
        onSnapshot(collection(db, 'stories'), (snapshot) => {
            allStories = [];
            snapshot.forEach(d => allStories.push({ id: d.id, ...d.data() }));
            allStories.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            setStatus('connected', '✓ Connected');
            renderManageTab();
        }, (err) => {
            setStatus('error', 'Error!');
        });
    }

    // TABS
    window.switchTab = function(tab, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        btn.classList.add('active');
    };

    // EPISODES - ADD
    window.addEpisode = function() {
        episodeCount++;
        const div = document.createElement('div');
        div.className = 'episode-item';
        div.id = 'epi-' + episodeCount;
        div.innerHTML = `
            <div class="episode-header">
                <span>Ep ${episodeCount}</span>
                <button class="btn-remove-epi" onclick="removeEpisode('epi-${episodeCount}')">✕ Remove</button>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" placeholder="Episode ${episodeCount} title" class="epi-title">
                </div>
                <div class="form-group">
                    <label>Video URL</label>
                    <input type="text" placeholder="https://...video.mp4" class="epi-url">
                </div>
            </div>`;
        document.getElementById('episodesList').appendChild(div);
    };

    window.removeEpisode = function(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    };

    // EPISODES - EDIT
    window.addEditEpisode = function() {
        editEpisodeCount++;
        const div = document.createElement('div');
        div.className = 'episode-item';
        div.id = 'edit-epi-' + editEpisodeCount;
        div.innerHTML = `
            <div class="episode-header">
                <span>Ep ${editEpisodeCount}</span>
                <button class="btn-remove-epi" onclick="removeEpisode('edit-epi-${editEpisodeCount}')">✕ Remove</button>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" placeholder="Episode title" class="edit-epi-title">
                </div>
                <div class="form-group">
                    <label>Video URL</label>
                    <input type="text" placeholder="Video URL" class="edit-epi-url">
                </div>
            </div>`;
        document.getElementById('editEpisodesList').appendChild(div);
    };

    // SAVE STORY
    window.saveStory = async function() {
        const folder = document.getElementById('storyFolder').value.trim();
        const name = document.getElementById('storyName').value.trim();
        const poster = document.getElementById('storyPoster').value.trim();
        const desc = document.getElementById('storyDesc').value.trim();

        if (!folder || !name) { showToast('Folder aur Story name required!', 'error'); return; }

        const episodes = [];
        document.querySelectorAll('#episodesList .episode-item').forEach((item, i) => {
            const title = item.querySelector('.epi-title').value.trim();
            const url = item.querySelector('.epi-url').value.trim();
            if (url) episodes.push({ title: title || 'Episode ' + (i + 1), url });
        });

        if (!episodes.length) { showToast('Kam se kam ek episode add karo!', 'error'); return; }

        try {
            showToast('⏳ Saving...', 'success');
            await addDoc(collection(db, 'stories'), {
                folder, name, poster, desc, episodes,
                likes: 0, views: 0, createdAt: serverTimestamp()
            });
            document.getElementById('storyFolder').value = '';
            document.getElementById('storyName').value = '';
            document.getElementById('storyPoster').value = '';
            document.getElementById('storyDesc').value = '';
            document.getElementById('episodesList').innerHTML = '';
            episodeCount = 0;
            addEpisode();
            showToast('✅ Story saved!', 'success');
        } catch(e) { showToast('❌ Error: ' + e.message, 'error'); }
    };

    // MANAGE TAB
    function renderManageTab() {
        const folders = [...new Set(allStories.map(s => s.folder))];
        const filterBar = document.getElementById('filterBar');
        filterBar.innerHTML = `<button class="filter-btn active" onclick="filterStories('all', this)">All (${allStories.length})</button>`;
        folders.forEach(f => {
            const c = allStories.filter(s => s.folder === f).length;
            filterBar.innerHTML += `<button class="filter-btn" onclick="filterStories('${f}', this)">${f} (${c})</button>`;
        });
        renderStoriesGrid(allStories);
    }

    window.filterStories = function(folder, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filtered = folder === 'all' ? allStories : allStories.filter(s => s.folder === folder);
        renderStoriesGrid(filtered);
    };

    function formatNum(n) {
        if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
        if (n >= 1000) return (n/1000).toFixed(1)+'K';
        return n||0;
    }

    function renderStoriesGrid(stories) {
        const grid = document.getElementById('storiesGrid');
        if (!stories.length) {
            grid.innerHTML = `<div class="no-stories"><div class="icon">📭</div><p>No stories</p></div>`;
            return;
        }
        grid.innerHTML = stories.map(story => `
            <div class="story-card-admin">
                <div class="card-poster-wrap">
                    ${story.poster
                        ? `<img src="${story.poster}" class="story-poster-admin" onerror="this.style.display='none'" alt="">`
                        : `<div class="story-poster-placeholder">🎬</div>`}
                    <span class="card-badge">📂 ${story.folder}</span>
                    <div class="card-stats">
                        <span class="stat-badge">👁️ ${formatNum(story.views)}</span>
                        <span class="stat-badge">❤️ ${formatNum(story.likes)}</span>
                    </div>
                </div>
                <div class="story-info-admin">
                    <h3 title="${story.name}">${story.name}</h3>
                    <p class="story-epi-count">🎬 ${story.episodes?.length || 0} Episodes</p>
                    <div class="story-actions">
                        <button class="btn-edit" onclick="openEditModal('${story.id}')">✏️ Edit</button>
                        <button class="btn-delete" onclick="deleteStory('${story.id}')">🗑️ Delete</button>
                    </div>
                </div>
            </div>`).join('');
    }

    // EDIT
    window.openEditModal = function(docId) {
        editingDocId = docId;
        const story = allStories.find(s => s.id === docId);
        if (!story) return;

        document.getElementById('editFolder').value = story.folder;
        document.getElementById('editName').value = story.name;
        document.getElementById('editPoster').value = story.poster || '';
        document.getElementById('editDesc').value = story.desc || '';

        const editList = document.getElementById('editEpisodesList');
        editList.innerHTML = '';
        editEpisodeCount = 0;

        (story.episodes || []).forEach((epi, i) => {
            editEpisodeCount++;
            const div = document.createElement('div');
            div.className = 'episode-item';
            div.id = 'edit-epi-' + editEpisodeCount;
            div.innerHTML = `
                <div class="episode-header">
                    <span>Ep ${editEpisodeCount}</span>
                    <button class="btn-remove-epi" onclick="removeEpisode('edit-epi-${editEpisodeCount}')">✕ Remove</button>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" value="${epi.title}" class="edit-epi-title">
                    </div>
                    <div class="form-group">
                        <label>Video URL</label>
                        <input type="text" value="${epi.url}" class="edit-epi-url">
                    </div>
                </div>`;
            editList.appendChild(div);
        });

        document.getElementById('editModal').classList.add('active');
    };

    window.closeModal = function() {
        document.getElementById('editModal').classList.remove('active');
        editingDocId = null;
    };

    window.updateStory = async function() {
        const folder = document.getElementById('editFolder').value.trim();
        const name = document.getElementById('editName').value.trim();
        const poster = document.getElementById('editPoster').value.trim();
        const desc = document.getElementById('editDesc').value.trim();

        if (!folder || !name) { showToast('Required fields bharo!', 'error'); return; }

        const episodes = [];
        document.querySelectorAll('#editEpisodesList .episode-item').forEach((item, i) => {
            const title = item.querySelector('.edit-epi-title').value.trim();
            const url = item.querySelector('.edit-epi-url').value.trim();
            if (url) episodes.push({ title: title || 'Episode ' + (i + 1), url });
        });

        try {
            await updateDoc(doc(db, 'stories', editingDocId), { folder, name, poster, desc, episodes });
            closeModal();
            showToast('✅ Updated!', 'success');
        } catch(e) { showToast('❌ Error: ' + e.message, 'error'); }
    };

    // DELETE
    window.deleteStory = async function(docId) {
        if (!confirm('Delete karna chahte ho?')) return;
        try {
            await deleteDoc(doc(db, 'stories', docId));
            showToast('🗑️ Deleted!', 'success');
        } catch(e) { showToast('❌ Error!', 'error'); }
    };

    // TOAST
    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast ${type} show`;
        setTimeout(() => { t.className = 'toast'; }, 3000);
    }
    window.importArchiveEpisodes = async function() {
    const archiveUrl = prompt("Archive.org Folder URL daalo");

    if (!archiveUrl) return;

    try {
        const identifier = archiveUrl.split('/').pop();
        const res = await fetch(`https://archive.org/metadata/${identifier}`);
        const data = await res.json();

        const videos = data.files
    .filter(f => {
        const name = f.name.toLowerCase();

        return (
            name.endsWith('.mp4') &&
            !name.endsWith('.ia.mp4')
        );
    })
    .sort((a, b) =>
        a.name.localeCompare(
            b.name,
            undefined,
            { numeric: true }
        )
    );

        document.getElementById('episodesList').innerHTML = '';
        episodeCount = 0;

        videos.forEach((video, index) => {
            addEpisode();

            const item = document.querySelectorAll('#episodesList .episode-item')[index];

            item.querySelector('.epi-title').value =
                `Episode ${index + 1}`;

            item.querySelector('.epi-url').value =
                `${archiveUrl}/${video.name}`;
        });

        showToast(`✅ ${videos.length} Episodes Imported`, 'success');

    } catch (e) {
        console.error(e);
        showToast('❌ Import Failed', 'error');
    }
};
    window.showToast = showToast;
</script>
