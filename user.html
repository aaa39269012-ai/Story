<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pawan TV</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
        :root{--primary:#6C63FF;--secondary:#FF6584;--accent:#00D9FF;--darker:#06060D;--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1)}
        body{background:var(--darker);min-height:100vh;color:#fff;overflow-x:hidden}
        .bg-animation{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden}
        .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;animation:blobMove 20s infinite ease-in-out}
        .blob:nth-child(1){width:300px;height:300px;background:var(--primary);top:-150px;left:-150px}
        .blob:nth-child(2){width:400px;height:400px;background:var(--secondary);bottom:-200px;right:-200px;animation-delay:-5s}
        .blob:nth-child(3){width:250px;height:250px;background:var(--accent);top:50%;left:50%;animation-delay:-10s}
        @keyframes blobMove{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,50px) scale(1.1)}50%{transform:translate(-30px,80px) scale(0.9)}75%{transform:translate(80px,-30px) scale(1.05)}}
        .header{padding:15px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:rgba(6,6,13,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border)}
        .logo-section{display:flex;align-items:center;gap:12px}
        .logo-icon{width:45px;height:45px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 5px 20px rgba(108,99,255,0.4)}
        .logo-text h1{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,#fff,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo-text span{font-size:.65rem;color:#666;text-transform:uppercase;letter-spacing:2px}
        .header-icons{display:flex;gap:10px}
        .header-icon{width:40px;height:40px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer;position:relative}
        .notification-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--secondary);border-radius:50%;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
        .search-container{display:none;position:fixed;inset:0;background:rgba(6,6,13,0.98);z-index:200;padding:20px;overflow-y:auto}
        .search-container.active{display:block}
        .search-header{display:flex;gap:15px;margin-bottom:25px}
        .search-back{width:45px;height:45px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .search-box{flex:1;position:relative}
        .search-box>i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#666}
        .search-input{width:100%;padding:15px 45px;background:var(--glass);border:2px solid var(--glass-border);border-radius:15px;color:#fff;font-size:1rem;outline:none}
        .search-input:focus{border-color:var(--primary)}
        .clear-search{position:absolute;right:15px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;width:25px;height:25px;border-radius:50%;color:#888;cursor:pointer;display:none}
        .clear-search.show{display:flex;align-items:center;justify-content:center}
        .recent-searches{margin-top:20px}
        .recent-title{display:flex;justify-content:space-between;color:#888;font-size:.9rem;margin-bottom:15px}
        .clear-all{background:none;border:none;color:var(--secondary);cursor:pointer}
        .recent-item{display:flex;align-items:center;gap:15px;padding:12px 15px;background:var(--glass);border-radius:12px;margin-bottom:10px;cursor:pointer}
        .recent-item i{color:#666}.recent-item span{flex:1}
        .search-results{display:none}.search-results.show{display:block}
        .results-title{color:#666;font-size:.85rem;margin-bottom:15px}.results-title span{color:var(--primary);font-weight:600}
        .results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
        .no-results{text-align:center;padding:60px 20px;grid-column:1/-1}.no-results i{font-size:4rem;color:#333;margin-bottom:20px}
        .loading-screen{position:fixed;inset:0;background:var(--darker);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
        .loading-screen .logo{font-size:4rem;margin-bottom:20px}
        .loading-bar{width:200px;height:4px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;margin-top:30px}
        .loading-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));animation:loadAnim 2s ease-in-out forwards}
        @keyframes loadAnim{0%{width:0}100%{width:100%}}
        .home-screen{padding-bottom:100px}
        .folder-section{margin-bottom:25px}
        .folder-header{display:flex;align-items:center;justify-content:space-between;padding:15px;cursor:pointer}
        .folder-title{display:flex;align-items:center;gap:12px}
        .folder-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
        .folder-info h3{font-size:1rem}.folder-info span{font-size:.7rem;color:#666}
        .folder-toggle{width:30px;height:30px;background:var(--glass);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#888;transition:transform .3s}
        .folder-toggle.collapsed{transform:rotate(-90deg)}
        .folder-content{overflow:hidden;transition:max-height .4s ease}
        .folder-content.collapsed{max-height:0!important}
        .stories-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:5px 15px 15px}
        .story-card{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--glass);border:1px solid var(--glass-border);transition:transform .3s}
        .story-card:hover{transform:scale(1.05)}.story-card:active{transform:scale(.98)}
        .story-card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.9) 100%);z-index:1}
        .story-card img{width:100%;height:100%;object-fit:cover}
        .story-info{position:absolute;bottom:0;left:0;right:0;padding:12px 10px;z-index:2}
        .story-name{font-size:.75rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .story-stats-home{display:flex;gap:10px;margin-top:5px;font-size:.6rem;color:#aaa}
        .story-stats-home span{display:flex;align-items:center;gap:3px}
        .ep-badge{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--primary),var(--secondary));padding:4px 8px;border-radius:20px;font-size:.55rem;font-weight:600;z-index:2}
        .play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);width:35px;height:35px;background:rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;transition:transform .3s}
        .play-overlay i{color:var(--primary);margin-left:3px}
        .story-card:hover .play-overlay{transform:translate(-50%,-50%) scale(1)}
        .no-stories{text-align:center;padding:60px 20px}
        .no-stories .icon{width:100px;height:100px;background:var(--glass);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:2.5rem;color:#444}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,26,.95);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);display:flex;justify-content:center;padding:15px 20px 25px;z-index:100}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--primary);font-size:.7rem;padding:8px 30px;background:rgba(108,99,255,.1);border-radius:20px;border:1px solid rgba(108,99,255,.3)}
        .nav-item i{font-size:1.3rem}
        .player-screen{display:none;position:fixed;inset:0;background:#000;z-index:500}
        .video-wrapper{width:100%;height:100%;position:relative;overflow:hidden}
        #videoPlayer{width:100%;height:100%;object-fit:cover}
        .player-controls{position:absolute;inset:0;z-index:20;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
        .player-controls.show{opacity:1;visibility:visible}
        .gradient-top{position:absolute;top:0;left:0;right:0;height:150px;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);pointer-events:none}
        .gradient-bottom{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);pointer-events:none}
        .kuku-top-bar{position:absolute;top:0;left:0;right:0;padding:15px;display:flex;align-items:center;justify-content:space-between}
        .kuku-back-btn,.kuku-more-btn{width:40px;height:40px;background:rgba(0,0,0,.5);border:none;border-radius:50%;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
        .kuku-episode-badge{background:rgba(0,0,0,.5);backdrop-filter:blur(10px);padding:8px 16px;border-radius:20px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:8px}
        .kuku-episode-badge i{color:var(--accent)}
        .kuku-side-actions{position:absolute;right:15px;bottom:150px;display:flex;flex-direction:column;gap:20px}
        .kuku-action-btn{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
        .kuku-action-btn .icon-wrap{width:50px;height:50px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;transition:all .3s}
        .kuku-action-btn.active .icon-wrap{background:var(--secondary)}
        .kuku-action-btn span{font-size:.7rem;color:rgba(255,255,255,.8)}
        .kuku-bottom-info{position:absolute;bottom:0;left:0;right:70px;padding:20px 15px 30px}
        .kuku-story-title{font-size:1.1rem;font-weight:700;margin-bottom:5px}
        .kuku-story-desc{font-size:.8rem;color:rgba(255,255,255,.7)}
        .kuku-progress-container{position:absolute;bottom:0;left:0;right:0;padding:0 15px 15px}
        .kuku-progress-bar{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:10px;cursor:pointer}
        .kuku-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:10px;width:0%;position:relative}
        .kuku-progress-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#fff;border-radius:50%}
        .kuku-time{display:flex;justify-content:space-between;font-size:.7rem;color:rgba(255,255,255,.6);margin-top:8px}
        .kuku-center-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15}
        .kuku-play-btn{width:80px;height:80px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);border:3px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;font-size:2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .kuku-play-btn i{margin-left:5px}
        .kuku-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;display:none;flex-direction:column;align-items:center;gap:15px}
        .kuku-loading.show{display:flex}
        .kuku-spinner{width:50px;height:50px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .double-tap-anim{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:35;pointer-events:none;opacity:0}
        .double-tap-anim.show{animation:dtPop .6s ease-out forwards}
        .double-tap-anim i{font-size:4rem;color:#fff}
        @keyframes dtPop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
        .epi-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:650}
        .epi-overlay.active{display:block}
        .epi-panel{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#1a1a2e,#0d0d1a);border-radius:25px 25px 0 0;z-index:700;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);max-height:70vh;display:flex;flex-direction:column}
        .epi-panel.active{transform:translateY(0)}
        .panel-handle{padding:15px;display:flex;justify-content:center}
        .handle-bar{width:50px;height:5px;background:rgba(255,255,255,.3);border-radius:10px}
        .panel-header{padding:0 20px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glass-border)}
        .panel-title{display:flex;align-items:center;gap:12px}
        .panel-title .icon{width:45px;height:45px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:12px;display:flex;align-items:center;justify-content:center}
        .panel-title h3{font-size:1rem}.panel-title span{font-size:.75rem;color:#888;display:block}
        .close-panel{width:40px;height:40px;background:var(--glass);border:1px solid var(--glass-border);border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .epi-grid-container{flex:1;overflow-y:auto;padding:20px}
        .epi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
        .epi-icon{aspect-ratio:1;background:var(--glass);border:2px solid var(--glass-border);border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;position:relative}
        .epi-icon:hover{transform:scale(1.1);border-color:var(--primary)}
        .epi-icon.active{background:linear-gradient(135deg,var(--primary),var(--secondary));border-color:transparent}
        .epi-icon .num{font-size:1.2rem;font-weight:700}.epi-icon .label{font-size:.55rem;color:rgba(255,255,255,.6)}
        .epi-icon.active .label{color:rgba(255,255,255,.9)}
        .playing-anim{display:none;position:absolute;bottom:8px;gap:2px}
        .epi-icon.active .playing-anim{display:flex}
        .playing-anim span{width:3px;background:#fff;border-radius:2px;animation:wave .6s infinite ease-in-out}
        .playing-anim span:nth-child(1){height:8px}.playing-anim span:nth-child(2){height:12px;animation-delay:.1s}.playing-anim span:nth-child(3){height:8px;animation-delay:.2s}
        @keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px}
        @media(max-width:400px){.stories-grid,.results-grid{gap:8px;padding:5px 10px 10px}.epi-grid{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:600px){.stories-grid,.results-grid{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:900px){.stories-grid,.results-grid{grid-template-columns:repeat(5,1fr);max-width:1000px;margin:0 auto}}
    </style>
</head>

        const video = document.getElementById('videoPlayer');
        const playerControls = document.getElementById('playerControls');
        const colors = [['#6C63FF','#FF6584'],['#11998e','#38ef7d'],['#fc4a1a','#f7b733'],['#ee0979','#ff6a00'],['#2193b0','#6dd5ed'],['#8E2DE2','#4A00E0']];

        // ==================== LOAD STORIES ====================
        async function loadStories() {
            try {
                const snap = await db.collection('stories').orderBy('createdAt','desc').get();
                stories = [];
                snap.forEach(doc => stories.push({id:doc.id,...doc.data()}));
                renderFolders();
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('homeScreen').style.display = 'block';
                    document.getElementById('bottomNav').style.display = 'flex';
                }, 2000);
            } catch(e) {
                console.error(e);
                document.getElementById('loadingScreen').innerHTML = `<div class="logo">銅</div><h2>Connection Error</h2><button onclick="location.reload()" style="margin-top:20px;padding:10px 30px;background:var(--primary);border:none;color:#fff;border-radius:25px;cursor:pointer">Retry</button>`;
            }
        }

        function getFolders() {
            const f={};
            stories.forEach((s,i) => { const n=s.folderName||'Others'; if(!f[n])f[n]=[]; f[n].push({...s,idx:i}); });
            return f;
        }

        function renderFolders() {
            const box = document.getElementById('foldersBox');
            if(!stories.length) { box.innerHTML=`<div class="no-stories"><div class="icon"><i class="fas fa-video-slash"></i></div><h3>No Stories</h3></div>`; return; }
            const folders = getFolders();
            let html='', ci=0;
            for(const [name,items] of Object.entries(folders)) {
                const c=colors[ci++%colors.length], id=name.replace(/\W/g,''), collapsed=collapsedFolders.includes(name);
                html+=`<div class="folder-section"><div class="folder-header" onclick="toggleFolder('${id}','${name}')"><div class="folder-title"><div class="folder-icon" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><i class="fas fa-folder"></i></div><div class="folder-info"><h3>${name}</h3><span>${items.length} Stories</span></div></div><div class="folder-toggle ${collapsed?'collapsed':''}" id="t${id}"><i class="fas fa-chevron-down"></i></div></div><div class="folder-content ${collapsed?'collapsed':''}" id="f${id}"><div class="stories-grid">${items.map(s=>storyCard(s,s.idx)).join('')}</div></div></div>`;
            }
            box.innerHTML = html;
            document.querySelectorAll('.folder-content:not(.collapsed)').forEach(el => el.style.maxHeight=el.scrollHeight+'px');
        }

        function toggleFolder(id,name) {
            const c=document.getElementById('f'+id), t=document.getElementById('t'+id);
            if(c.classList.contains('collapsed')) { c.classList.remove('collapsed'); t.classList.remove('collapsed'); c.style.maxHeight=c.scrollHeight+'px'; collapsedFolders=collapsedFolders.filter(f=>f!==name); }
            else { c.classList.add('collapsed'); t.classList.add('collapsed'); c.style.maxHeight='0'; if(!collapsedFolders.includes(name))collapsedFolders.push(name); }
            localStorage.setItem('ptv_folders',JSON.stringify(collapsedFolders));
        }

        function fmtNum(n) { if(n>=1e6)return(n/1e6).toFixed(1)+'M'; if(n>=1e3)return(n/1e3).toFixed(1)+'K'; return n.toString(); }

        function storyCard(story,idx) {
            return `<div class="story-card" onclick="playStory(${idx})"><img src="${story.posterLink}" onerror="this.src='https://via.placeholder.com/200x300/1a1a2e/6C63FF?text=No+Image'"><span class="ep-badge">${story.episodes.length} EP</span><div class="play-overlay"><i class="fas fa-play"></i></div><div class="story-info"><div class="story-name">${story.storyName}</div><div class="story-stats-home"><span><i class="fas fa-eye"></i> ${fmtNum(story.views||0)}</span><span><i class="fas fa-heart"></i> ${fmtNum(story.likes||0)}</span></div></div></div>`;
        }

        // ==================== PLAYER ====================
        function showControls() {
            playerControls.classList.add('show');
            clearTimeout(controlsTimer);
            if(!video.paused) controlsTimer=setTimeout(()=>playerControls.classList.remove('show'),3000);
        }

        function hideControls() { playerControls.classList.remove('show'); clearTimeout(controlsTimer); }

        function playStory(idx, epi=0) {
            currentStory=stories[idx]; currentStoryId=stories[idx].id; currentEpi=epi; viewCounted=false;
            isLiked = currentStory.likedBy && currentStory.likedBy.includes(userId);
            document.getElementById('homeScreen').style.display='none';
            document.getElementById('bottomNav').style.display='none';
            document.getElementById('searchBox').classList.remove('active');
            document.getElementById('playerScreen').style.display='block';
            loadEpisode();
            showControls();
        }

        async function loadEpisode() {
            const epi=currentStory.episodes[currentEpi];
            document.getElementById('kukuTitle').textContent=currentStory.storyName;
            document.getElementById('kukuDesc').textContent=`Episode ${epi.number} - ${currentStory.folderName}`;
            document.getElementById('kukuEpBadge').textContent=`Ep ${epi.number}/${currentStory.episodes.length}`;
            document.getElementById('likeCount').textContent=fmtNum(currentStory.likes||0);
            document.getElementById('viewCount').textContent=fmtNum(currentStory.views||0);
            document.getElementById('likeBtn').classList.toggle('active',isLiked);
            document.getElementById('kukuLoading').classList.add('show');
            video.src=epi.url; video.load();
            video.play().catch(()=>showControls());
            updatePlayBtn();
        }

        async function incrementView() {
            if(viewCounted)return; viewCounted=true;
            try { await db.collection('stories').doc(currentStoryId).update({views:firebase.firestore.FieldValue.increment(1)}); currentStory.views=(currentStory.views||0)+1; document.getElementById('viewCount').textContent=fmtNum(currentStory.views); } catch(e){console.error(e);}
        }

        async function toggleLike() {
            try {
                if(isLiked) {
                    await db.collection('stories').doc(currentStoryId).update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(userId)});
                    currentStory.likes=(currentStory.likes||1)-1; isLiked=false;
                } else {
                    await db.collection('stories').doc(currentStoryId).update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(userId)});
                    currentStory.likes=(currentStory.likes||0)+1; isLiked=true;
                    showDoubleTapAnim('fa-heart');
                }
                document.getElementById('likeBtn').classList.toggle('active',isLiked);
                document.getElementById('likeCount').textContent=fmtNum(currentStory.likes);
            } catch(e){console.error(e);}
        }

        function goHome() {
            video.pause(); video.src=''; hideControls();
            document.getElementById('playerScreen').style.display='none';
            document.getElementById('homeScreen').style.display='block';
            document.getElementById('bottomNav').style.display='flex';
            closeEpiPanel(); loadStories();
        }

        function togglePlay() { video.paused?video.play():video.pause(); }

        function updatePlayBtn() {
            document.getElementById('kukuPlayBtn').innerHTML = video.paused?'<i class="fas fa-play"></i>':'<i class="fas fa-pause"></i>';
        }

        function nextEpi() { if(currentEpi<currentStory.episodes.length-1) { currentEpi++; viewCounted=false; loadEpisode(); showControls(); } }
        function prevEpi() { if(currentEpi>0) { currentEpi--; viewCounted=false; loadEpisode(); showControls(); } }

        function seekVideo(e) { const r=document.getElementById('kukuProgress').getBoundingClientRect(); video.currentTime=((e.clientX-r.left)/r.width)*video.duration; }
        function fmtTime(s) { if(isNaN(s))return'0:00'; return`${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

        function showDoubleTapAnim(icon) {
            const a=document.getElementById('doubleTapAnim');
            a.innerHTML=`<i class="fas ${icon}"></i>`;
            a.classList.remove('show'); void a.offsetWidth; a.classList.add('show');
        }

        video.addEventListener('loadedmetadata',()=>{document.getElementById('kukuDuration').textContent=fmtTime(video.duration)});
        video.addEventListener('timeupdate',()=>{
            document.getElementById('kukuProgressFill').style.width=(video.currentTime/video.duration*100)+'%';
            document.getElementById('kukuCurrentTime').textContent=fmtTime(video.currentTime);
            if(video.currentTime>=10&&!viewCounted)incrementView();
        });
        video.addEventListener('playing',()=>{document.getElementById('kukuLoading').classList.remove('show');updatePlayBtn();clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>playerControls.classList.remove('show'),3000)});
        video.addEventListener('pause',()=>{updatePlayBtn();showControls()});
        video.addEventListener('waiting',()=>document.getElementById('kukuLoading').classList.add('show'));
        video.addEventListener('canplay',()=>document.getElementById('kukuLoading').classList.remove('show'));
        video.addEventListener('ended', () => { if (currentEpi < currentStory.episodes.length - 1) { nextEpi(); } else { goHome(); } });

        let touchY=0,lastTap=0;
        document.getElementById('videoWrapper').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
        document.getElementById('videoWrapper').addEventListener('touchend',e=>{
            const diff=touchY-e.changedTouches[0].clientY;
            const now=Date.now();
            if(now-lastTap<300){togglePlay();showDoubleTapAnim(video.paused?'fa-pause':'fa-play');}
            lastTap=now;
            if(Math.abs(diff)>100)diff>0?nextEpi():prevEpi();
        },{passive:true});

        document.getElementById('videoWrapper').addEventListener('click',e=>{
            if(e.target.tagName==='VIDEO'){playerControls.classList.contains('show')&&!video.paused?hideControls():showControls();}
        });

        function openEpiPanel() {
            document.getElementById('panelName').textContent=currentStory.storyName;
            document.getElementById('panelCount').textContent=currentStory.episodes.length+' Episodes';
            document.getElementById('epiGrid').innerHTML=currentStory.episodes.map((ep,i)=>`<div class="epi-icon ${i===currentEpi?'active':''}" onclick="changeEpi(${i})"><span class="num">${ep.number}</span><span class="label">EP</span><div class="playing-anim"><span></span><span></span><span></span></div></div>`).join('');
            document.getElementById('epiOverlay').classList.add('active');
            document.getElementById('epiPanel').classList.add('active');
        }

        function closeEpiPanel() { document.getElementById('epiOverlay').classList.remove('active'); document.getElementById('epiPanel').classList.remove('active'); }
        function changeEpi(idx) { currentEpi=idx; viewCounted=false; closeEpiPanel(); loadEpisode(); showControls(); }

        function openSearch() {
            document.getElementById('searchBox').classList.add('active');
            document.getElementById('searchInput').focus();
            renderRecent();
            document.getElementById('resultsSection').classList.remove('show');
            document.getElementById('recentSection').style.display='block';
        }

        function closeSearch() { document.getElementById('searchBox').classList.remove('active'); document.getElementById('searchInput').value=''; }

        document.getElementById('searchInput').addEventListener('input',function(){
            document.getElementById('clearBtn').classList.toggle('show',this.value.length>0);
            doSearch(this.value);
        });

        function clearSearchInput() {
            document.getElementById('searchInput').value='';
            document.getElementById('clearBtn').classList.remove('show');
            document.getElementById('resultsSection').classList.remove('show');
            document.getElementById('recentSection').style.display='block';
        }

        function doSearch(q) {
            if(!q.trim()){document.getElementById('resultsSection').classList.remove('show');document.getElementById('recentSection').style.display='block';return;}
            const term=q.toLowerCase();
            const results=stories.filter(s=>s.storyName.toLowerCase().includes(term)||s.folderName.toLowerCase().includes(term));
            document.getElementById('queryText').textContent=q;
            document.getElementById('recentSection').style.display='none';
            document.getElementById('resultsSection').classList.add('show');
            document.getElementById('resultsGrid').innerHTML=results.length?results.map(s=>storyCard(s,stories.findIndex(x=>x.id===s.id))).join(''):`<div class="no-results"><i class="fas fa-search"></i><h3>No Results</h3></div>`;
            saveRecent(q);
        }

        function saveRecent(q){q=q.trim();if(!q)return;recentSearches=recentSearches.filter(s=>s.toLowerCase()!==q.toLowerCase());recentSearches.unshift(q);recentSearches=recentSearches.slice(0,10);localStorage.setItem('ptv_recent',JSON.stringify(recentSearches));}
        function renderRecent(){
            if(!recentSearches.length){document.getElementById('recentSection').style.display='none';return;}
            document.getElementById('recentSection').style.display='block';
            document.getElementById('recentList').innerHTML=recentSearches.map((s,i)=>`<div class="recent-item" onclick="useRecent('${s.replace(/'/g,"\\'")}')"><i class="fas fa-history"></i><span>${s}</span><i class="fas fa-times" onclick="event.stopPropagation();removeRecent(${i})"></i></div>`).join('');
        }

        function useRecent(q){document.getElementById('searchInput').value=q;document.getElementById('clearBtn').classList.add('show');doSearch(q);}
        function removeRecent(i){recentSearches.splice(i,1);localStorage.setItem('ptv_recent',JSON.stringify(recentSearches));renderRecent();}
        function clearAllRecent(){recentSearches=[];localStorage.setItem('ptv_recent','[]');renderRecent();}

        document.addEventListener('keydown',e=>{
            if(document.getElementById('searchBox').classList.contains('active')){if(e.key==='Escape')closeSearch();return;}
            if(document.getElementById('playerScreen').style.display==='block'){
                showControls();
                if(e.key==='Escape')document.getElementById('epiPanel').classList.contains('active')?closeEpiPanel():goHome();
                if(e.key===' '){e.preventDefault();togglePlay();}
                if(e.key==='ArrowLeft')video.currentTime-=10;
                if(e.key==='ArrowRight')video.currentTime+=10;
                if(e.key==='ArrowUp')prevEpi();
                if(e.key==='ArrowDown')nextEpi();
                if(e.key==='e')document.getElementById('epiPanel').classList.contains('active')?closeEpiPanel():openEpiPanel();
                if(e.key==='l')toggleLike();
            }
        });

        window.addEventListener('popstate',()=>{
            if(document.getElementById('searchBox').classList.contains('active'))closeSearch();
            else if(document.getElementById('epiPanel').classList.contains('active'))closeEpiPanel();
            else if(document.getElementById('playerScreen').style.display==='block')goHome();
            history.pushState(null,null,location.href);
        });
        history.pushState(null,null,location.href);
        loadStories();
    </script>
</body>
    </html>
