<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pawan TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0a0a; color: #fff; min-height: 100vh; overflow-x: hidden; }
        #homeScreen { min-height: 100vh; }
        .home-header { background: linear-gradient(180deg, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.8) 100%); padding: 12px 12px 8px; position: sticky; top: 0; z-index: 50; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .app-logo { font-size: 1.4rem; font-weight: 900; color: #e50914; text-shadow: 0 0 20px rgba(229,9,20,0.5); letter-spacing: 2px; }
        .folder-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .folder-tabs::-webkit-scrollbar { display: none; }
        .folder-tab { padding: 5px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; color: #ccc; cursor: pointer; white-space: nowrap; font-size: 0.75rem; transition: all 0.3s; flex-shrink: 0; }
        .folder-tab.active { background: #e50914; border-color: #e50914; color: #fff; font-weight: bold; }
        .search-bar { padding: 0 12px 8px; }
        .search-input { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; color: #fff; font-size: 0.8rem; outline: none; }
        .search-input::placeholder { color: #666; }
        .search-input:focus { border-color: #e50914; }
        .folder-section { margin-bottom: 18px; padding: 0 10px; }
        .folder-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .folder-title::before { content: ''; width: 3px; height: 14px; background: #e50914; border-radius: 2px; }
        .stories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
        .stories-scroll::-webkit-scrollbar { display: none; }
        .stories-grid-user { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
        .story-card-user { flex-shrink: 0; width: 90px; cursor: pointer; transition: transform 0.2s; position: relative; }
        .stories-grid-user .story-card-user { width: 100%; }
        .story-card-user:active { transform: scale(0.95); }
        .story-poster-user { width: 100%; height: 130px; object-fit: cover; border-radius: 7px; display: block; }
        .story-poster-placeholder-user { width: 100%; height: 130px; border-radius: 7px; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .story-card-user h4 { font-size: 0.65rem; margin-top: 4px; line-height: 1.2; color: #ddd; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .story-epi-badge { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 1px 5px; font-size: 0.55rem; color: #ccc; }
        .story-views-badge { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.85); border-radius: 4px; padding: 1px 5px; font-size: 0.55rem; color: #ccc; }
        .empty-state { text-align: center; padding: 60px 20px; color: #555; }
        .empty-state .icon { font-size: 4rem; margin-bottom: 15px; }
        #playerScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; align-items: stretch; }
        #playerScreen.active { display: flex; }
        .ad-bar { width: 100%; height: 60px; background: #050505; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; position: relative; }
        .ad-bar-top { border-bottom: 1px solid #111; }
        .ad-bar-bottom { border-top: 1px solid #111; }
        .ad-tag { position: absolute; top: 2px; left: 4px; font-size: 0.4rem; color: #222; letter-spacing: 1px; text-transform: uppercase; pointer-events: none; }
        .ad-inner { width: 320px; height: 50px; overflow: hidden; }
        .video-wrapper { position: relative; width: 100%; flex: 1; background: #000; overflow: hidden; min-height: 0; }
        #mainVideo { width: 100%; height: 100%; object-fit: contain; display: block; }
        .player-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .player-overlay.visible { opacity: 1; pointer-events: all; }
        .player-top { background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
        .btn-back-player { width: 38px; height: 38px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; color: #fff; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .player-story-title { flex: 1; text-align: center; font-weight: bold; font-size: 0.9rem; margin: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-epi-list { width: 38px; height: 38px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; color: #fff; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); position: relative; }
        .epi-count-badge { position: absolute; top: -5px; right: -5px; background: #e50914; border-radius: 50%; width: 17px; height: 17px; font-size: 0.58rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .center-controls { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 28px; align-items: center; }
        .btn-prev, .btn-next, .btn-play-pause { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-play-pause { width: 55px; height: 55px; font-size: 1.4rem; }
        .btn-prev, .btn-next { width: 42px; height: 42px; font-size: 0.95rem; }
        .player-bottom { background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, transparent 100%); padding: 8px 15px 12px; }
        .epi-title-display { font-size: 0.8rem; color: #bbb; margin-bottom: 7px; }

        .video-progress-fill { height: 100%; background: #e50914; border-radius: 3px; transition: width 0.1s; width: 0%; }
        .player-actions { display: flex; align-items: center; justify-content: space-between; }
        .action-left { display: flex; align-items: center; gap: 12px; }
        .btn-like { display: flex; align-items: center; gap: 5px; background: transparent; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; padding: 6px 12px; border-radius: 25px; transition: all 0.3s; }
        .btn-like .heart-icon { font-size: 1rem; transition: transform 0.3s; display: inline-block; }
        .btn-like .like-count { font-size: 0.8rem; color: #ddd; font-weight: bold; }
        .btn-like.liked { background: rgba(229,9,20,0.2); border-color: #e50914; }
        .btn-like.liked .heart-icon { color: #e50914; }
        .btn-like.liked .like-count { color: #e50914; }
        .btn-like.animate .heart-icon { transform: scale(1.5); }
        .views-display { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: #aaa; }
        .btn-share { display: flex; align-items: center; gap: 5px; background: transparent; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; padding: 6px 12px; border-radius: 25px; color: #ddd; font-size: 0.8rem; }
        .swipe-indicator { position: absolute; left: 50%; transform: translateX(-50%); font-size: 0.65rem; color: rgba(255,255,255,0.3); pointer-events: none; }
        .swipe-indicator.top { top: 60px; }
        .swipe-indicator.bottom { bottom: 90px; }
        #epiPanel { position: fixed; top: 0; right: -100%; max-width: 230px; width: auto; height: 100%; background: rgba(8,8,8,0.98); border-left: 1px solid rgba(255,255,255,0.08); z-index: 10001; transition: right 0.3s ease; display: flex; flex-direction: column; }
        #epiPanel.open { right: 0; }
        .epi-panel-header { padding: 12px 10px; background: rgba(229,9,20,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .epi-panel-header h3 { font-size: 0.82rem; color: #e50914; }
        .btn-close-epi { width: 26px; height: 26px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: #fff; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .epi-number-grid { flex: 1; overflow-y: auto; padding: 8px 7px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
        .epi-number-grid::-webkit-scrollbar { width: 3px; }
        .epi-number-grid::-webkit-scrollbar-thumb { background: #e50914; border-radius: 2px; }
        .epi-num-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; color: #bbb; font-size: 0.78rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .epi-num-btn:active { transform: scale(0.9); }
        .epi-num-btn.playing { background: #e50914; border-color: #e50914; color: #fff; box-shadow: 0 0 10px rgba(229,9,20,0.5); }
        #epiPanelOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; }
        #epiPanelOverlay.active { display: block; }
        .next-epi-toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.92); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 9px 14px; display: none; align-items: center; gap: 10px; font-size: 0.82rem; white-space: nowrap; z-index: 100; }
        .next-epi-toast.show { display: flex; }
        .btn-cancel-next { background: none; border: 1px solid rgba(255,255,255,0.25); border-radius: 5px; color: #fff; padding: 3px 8px; cursor: pointer; font-size: 0.72rem; }
        .video-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 10; }
        .video-loading.show { display: block; }
        .spinner { width: 42px; height: 42px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #e50914; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .like-popup { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); font-size: 2.5rem; opacity: 0; pointer-events: none; transition: all 0.4s; z-index: 200; }
        .like-popup.show { opacity: 1; transform: translateX(-50%) translateY(-25px); }
        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; }
        .loading-logo { font-size: 2.8rem; color: #e50914; font-weight: 900; margin-bottom: 20px; }
        .loading-bar { width: 180px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .loading-bar-fill { height: 100%; background: #e50914; animation: loadBar 1.5s ease-in-out infinite; }
        @keyframes loadBar { 0%{width:0%} 60%{width:80%} 100%{width:100%} }
        .loading-text { color: #444; font-size: 0.82rem; margin-top: 12px; }
        @media (max-width: 480px) { #epiPanel { max-width: 195px; } .epi-num-btn { width: 33px; height: 33px; font-size: 0.72rem; } .stories-grid-user { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; } .story-poster-user, .story-poster-placeholder-user { height: 115px; } }
    </style>
</head>

</div>

<script>
// Redirect blocker
(function() {
    var _open = window.open;
    window.open = function(url, name, specs) {
        if (!url || url === '' || url === 'about:blank' || url.indexOf(location.hostname) !== -1) {
            return _open.call(window, url, name, specs);
        }
        return null;
    };
})();

var AD_KEY = 'a97d396821d6662ef45a8efcd76329f8';
var AD_URL = 'https://offevasionrecruit.com/' + AD_KEY + '/invoke.js';

// ✅ Ye function ek ad iframe banata hai aur inject karta hai
function makeAdIframe() {
    var iframe = document.createElement('iframe');
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
    iframe.style.cssText = 'width:320px;height:50px;border:none;display:block;';
    iframe.scrolling = 'no';

    var html = '<!DOCTYPE html><html><head>'
        + '<style>*{margin:0;padding:0}body{background:#000;width:320px;height:50px;overflow:hidden;display:flex;align-items:center;justify-content:center}</style>'
        + '</head><body>'
        + '<script>var atOptions={"key":"' + AD_KEY + '","format":"iframe","height":50,"width":320,"params":{}}<\/script>'
        + '<script src="' + AD_URL + '?c=' + Date.now() + '"><\/script>'
        + '</body></html>';

    iframe.srcdoc = html;
    return iframe;
}

// ✅ Ad load function - naya iframe inject karta hai
function loadAd(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;
    // Purana clear karo
    container.innerHTML = '';
    // Naya iframe add karo
    container.appendChild(makeAdIframe());
}

// ✅ Dono ads load karo
function loadAllAds() {
    loadAd('adTop');
    setTimeout(function() { loadAd('adBottom'); }, 600);
}

// ✅ Dono ads clear karo
function clearAllAds() {
    var t = document.getElementById('adTop');
    var b = document.getElementById('adBottom');
    if (t) t.innerHTML = '';
    if (b) b.innerHTML = '';
}

// ✅ Sirf ek ad refresh karo (epi change par)
function refreshAds() {
    loadAd('adTop');
    setTimeout(function() { loadAd('adBottom'); }, 600);
}

window.loadAllAds  = loadAllAds;
window.clearAllAds = clearAllAds;
window.refreshAds  = refreshAds;
</script>

<!-- FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, increment }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCnCCWVcNhFBTCh7Tu9ctQ7QiGasUvgw4s",
        authDomain: "kuku-1cb36.firebaseapp.com",
        projectId: "kuku-1cb36",
        storageBucket: "kuku-1cb36.firebasestorage.app",
        messagingSenderId: "1089968385102",
        appId: "1:1089968385102:web:bf53c0b9b05c5659e3671f",
        measurementId: "G-FPTKTH9QXT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let stories = [], currentStory = null, currentStoryDocId = null;
    let currentEpiIndex = 0, currentFolder = 'all';
    let autoNextTimer = null, overlayTimer = null, isOverlayVisible = false;
    let touchStartY = 0, touchStartX = 0;
    let hasLiked = false, viewCounted = false, viewTimer = null;

    function pushState(state) { history.pushState({ screen: state }, '', ''); }

    window.addEventListener('popstate', function() {
        if (document.getElementById('epiPanel').classList.contains('open')) {
            closeEpiPanel(); pushState('player'); return;
        }
        if (document.getElementById('playerScreen').classList.contains('active')) {
            closePlayerInternal();
        }
    });

    function init() {
        history.replaceState({ screen: 'home' }, '', '');
        loadStories(); setupVideoEvents(); setupTouchEvents();
    }

    function loadStories() {
        onSnapshot(collection(db, 'stories'), (snapshot) => {
            stories = [];
            snapshot.forEach(d => stories.push({ docId: d.id, ...d.data() }));
            stories.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'block';
            renderHome();
            if (currentStoryDocId) {
                const updated = stories.find(s => s.docId === currentStoryDocId);
                if (updated) { currentStory = updated; updateLikeViewUI(); }
            }
        }, () => {
            document.getElementById('loadingScreen').innerHTML = `
                <div class="loading-logo">📺</div>
                <p style="color:#e50914;margin-top:20px;">Connection failed.</p>
                <button onclick="location.reload()" style="margin-top:15px;padding:10px 25px;background:#e50914;border:none;border-radius:8px;color:#fff;cursor:pointer;">🔄 Retry</button>`;
        });
    }

    function renderHome() {
        const content = document.getElementById('homeContent');
        const tabsEl = document.getElementById('folderTabs');
        if (!stories.length) {
            tabsEl.innerHTML = '';
            content.innerHTML = `<div class="empty-state"><div class="icon">📺</div><p style="color:#444;margin-top:10px;">Koi story nahi</p></div>`;
            return;
        }
        const folders = ['all', ...new Set(stories.map(s => s.folder))];
        tabsEl.innerHTML = folders.map(f => `
            <button class="folder-tab ${f === currentFolder ? 'active' : ''}" onclick="filterByFolder('${f}', this)">
                ${f === 'all' ? '🏠 All' : '📂 ' + f}
            </button>`).join('');
        renderContent(currentFolder);
    }
    window.renderHome = renderHome;

    function renderContent(folder) {
        const content = document.getElementById('homeContent');
        if (folder === 'all') {
            const folders = [...new Set(stories.map(s => s.folder))];
            content.innerHTML = folders.map(f => {
                const fs = stories.filter(s => s.folder === f);
                return `<div class="folder-section"><div class="folder-title">📂 ${f}</div>
                    <div class="stories-scroll">${fs.map(s => storyCardHTML(s)).join('')}</div></div>`;
            }).join('');
        } else {
            const filtered = stories.filter(s => s.folder === folder);
            content.innerHTML = `<div class="folder-section">
                <div class="stories-grid-user">${filtered.map(s => storyCardHTML(s)).join('')}</div></div>`;
        }
    }

    function storyCardHTML(story) {
        const idx = stories.findIndex(s => s.docId === story.docId);
        return `<div class="story-card-user" onclick="openStory(${idx})">
            ${story.poster
                ? `<img src="${story.poster}" class="story-poster-user" loading="lazy" alt="${story.name}" onerror="this.outerHTML='<div class=\\'story-poster-placeholder-user\\'><span>🎬</span></div>'">`
                : `<div class="story-poster-placeholder-user"><span>🎬</span></div>`}
            <span class="story-epi-badge">${story.episodes?.length || 0} Ep</span>
            <span class="story-views-badge">👁️ ${formatNum(story.views || 0)}</span>
            <h4>${story.name}</h4>
        </div>`;
    }

    function formatNum(n) {
        if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
        if (n >= 1000) return (n/1000).toFixed(1)+'K';
        return n.toString();
    }

    window.filterByFolder = function(folder, btn) {
        currentFolder = folder;
        document.querySelectorAll('.folder-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); renderContent(folder);
    };

    window.searchStories = function(query) {
        if (!query.trim()) { renderContent(currentFolder); return; }
        const filtered = stories.filter(s =>
            s.name.toLowerCase().includes(query.toLowerCase()) ||
            s.folder.toLowerCase().includes(query.toLowerCase())
        );
        const content = document.getElementById('homeContent');
        if (!filtered.length) {
            content.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p style="color:#444;">"${query}" nahi mila</p></div>`;
        } else {
            content.innerHTML = `<div class="folder-section">
                <div class="folder-title">🔍 (${filtered.length})</div>
                <div class="stories-grid-user">${filtered.map(s => storyCardHTML(s)).join('')}</div></div>`;
        }
    };

    window.openStory = function(index) {
        currentStory = stories[index];
        currentStoryDocId = currentStory.docId;
        currentEpiIndex = 0;
        hasLiked = getLikedStatus(currentStoryDocId);
        viewCounted = false;
        openPlayer();
    };

    function openPlayer() {
        if (!currentStory || !currentStory.episodes?.length) return;
        document.getElementById('playerScreen').classList.add('active');
        document.body.style.overflow = 'hidden';
        document.getElementById('playerTitle').textContent = currentStory.name;
        document.getElementById('epiCountBadge').textContent = currentStory.episodes.length;
        updateLikeViewUI();
        loadEpisode(currentEpiIndex);
        buildEpiGrid();
        showOverlay();
        pushState('player');
        // ✅ Player open hone par ads load karo
        setTimeout(() => window.loadAllAds(), 800);
    }

    window.handleBackBtn = function() { history.back(); };

    function closePlayerInternal() {
        const video = document.getElementById('mainVideo');
        video.pause(); video.src = '';
        document.getElementById('playerScreen').classList.remove('active');
        document.body.style.overflow = '';
        clearTimers(); closeEpiPanel(); clearTimeout(viewTimer);
        window.clearAllAds();
    }

    function loadEpisode(index) {
        if (!currentStory) return;
        if (index < 0) index = 0;
        if (index >= currentStory.episodes.length) return;
        currentEpiIndex = index;
        const epi = currentStory.episodes[index];
        const video = document.getElementById('mainVideo');
        document.getElementById('videoLoading').classList.add('show');
        video.src = epi.url;
        video.load();
        video.play().catch(() => {});
        document.getElementById('currentEpiTitle').textContent = `Ep ${index + 1}: ${epi.title}`;
        document.getElementById('playPauseBtn').textContent = '⏸';
        updateEpiGridHighlight();

        // ✅ Har episode change par ads refresh karo
        window.refreshAds();

        clearTimeout(viewTimer);
        if (!viewCounted) {
            viewTimer = setTimeout(() => { countView(); viewCounted = true; }, 10000);
        }
    }

    async function countView() {
        if (!currentStoryDocId) return;
        try { await updateDoc(doc(db, 'stories', currentStoryDocId), { views: increment(1) }); } catch(e) {}
    }

    window.toggleLike = async function() {
        if (!currentStoryDocId) return;
        const btn = document.getElementById('likeBtn');
        if (!hasLiked) {
            hasLiked = true; setLikedStatus(currentStoryDocId, true);
            btn.classList.add('liked', 'animate');
            btn.querySelector('.heart-icon').textContent = '❤️';
            setTimeout(() => btn.classList.remove('animate'), 300);
            showLikePopup();
            try { await updateDoc(doc(db, 'stories', currentStoryDocId), { likes: increment(1) }); } catch(e) {}
        } else {
            hasLiked = false; setLikedStatus(currentStoryDocId, false);
            btn.classList.remove('liked');
            btn.querySelector('.heart-icon').textContent = '🤍';
            try { await updateDoc(doc(db, 'stories', currentStoryDocId), { likes: increment(-1) }); } catch(e) {}
        }
    };

    function showLikePopup() {
        const p = document.getElementById('likePopup');
        p.classList.add('show'); setTimeout(() => p.classList.remove('show'), 700);
    }

    function updateLikeViewUI() {
        if (!currentStory) return;
        document.getElementById('likeCount').textContent = formatNum(currentStory.likes || 0);
        document.getElementById('viewCount').textContent = formatNum(currentStory.views || 0);
        const btn = document.getElementById('likeBtn');
        if (hasLiked) { btn.classList.add('liked'); btn.querySelector('.heart-icon').textContent = '❤️'; }
        else { btn.classList.remove('liked'); btn.querySelector('.heart-icon').textContent = '🤍'; }
    }

    function getLikedStatus(docId) { return !!(JSON.parse(localStorage.getItem('pawanTV_likes') || '{}')?.[docId]); }
    function setLikedStatus(docId, status) {
        const liked = JSON.parse(localStorage.getItem('pawanTV_likes') || '{}');
        liked[docId] = status; localStorage.setItem('pawanTV_likes', JSON.stringify(liked));
    }

    window.shareStory = function() {
        if (!currentStory) return;
        if (navigator.share) {
            navigator.share({ title: currentStory.name + ' - Pawan TV', url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(window.location.href).then(() => showMiniToast('✅ Copied!')).catch(() => {});
        }
    };

    function showMiniToast(msg) {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.88);color:#fff;padding:9px 18px;border-radius:20px;font-size:0.82rem;z-index:99999;white-space:nowrap;`;
        el.textContent = msg; document.body.appendChild(el);
        setTimeout(() => el.remove(), 2500);
    }

    window.togglePlayPause = function() {
        const video = document.getElementById('mainVideo');
        if (video.paused) { video.play(); document.getElementById('playPauseBtn').textContent = '⏸'; }
        else { video.pause(); document.getElementById('playPauseBtn').textContent = '▶'; }
    };

    window.prevEpisode = function() { if (currentEpiIndex > 0) loadEpisode(currentEpiIndex - 1); };
    window.nextEpisode = function() {
        if (currentStory && currentEpiIndex < currentStory.episodes.length - 1) loadEpisode(currentEpiIndex + 1);
    };

    function startAutoNext() {
    if (!currentStory || currentEpiIndex >= currentStory.episodes.length - 1) return;

    // Direct next episode play (no delay)
    window.nextEpisode();
}

    window.cancelAutoNext = function() { clearInterval(autoNextTimer); document.getElementById('nextEpiToast').classList.remove('show'); };
    function clearTimers() { clearInterval(autoNextTimer); clearTimeout(overlayTimer); }

    function showOverlay() {
        document.getElementById('playerOverlay').classList.add('visible');
        isOverlayVisible = true; clearTimeout(overlayTimer);
        overlayTimer = setTimeout(hideOverlay, 3500);
    }
    function hideOverlay() { document.getElementById('playerOverlay').classList.remove('visible'); isOverlayVisible = false; }

    function setupVideoEvents() {
        const video = document.getElementById('mainVideo');
        const wrapper = document.getElementById('videoWrapper');
        wrapper.addEventListener('click', e => {
            if (e.target === wrapper || e.target === video) isOverlayVisible ? hideOverlay() : showOverlay();
        });
        video.addEventListener('waiting', () => document.getElementById('videoLoading').classList.add('show'));
        video.addEventListener('canplay', () => document.getElementById('videoLoading').classList.remove('show'));
        video.addEventListener('playing', () => { document.getElementById('videoLoading').classList.remove('show'); document.getElementById('playPauseBtn').textContent = '⏸'; });
        video.addEventListener('pause', () => document.getElementById('playPauseBtn').textContent = '▶');
        video.addEventListener('timeupdate', () => {
            if (video.duration) document.getElementById('progressFill').style.width = ((video.currentTime / video.duration) * 100) + '%';
        });
        video.addEventListener('ended', () => startAutoNext());
        video.addEventListener('error', () => document.getElementById('videoLoading').classList.remove('show'));
    }

    window.seekVideo = function(e) {
        const video = document.getElementById('mainVideo');
        const bar = document.getElementById('videoProgress');
        const rect = bar.getBoundingClientRect();
        if (video.duration) video.currentTime = video.duration * ((e.clientX - rect.left) / rect.width);
    };

    function setupTouchEvents() {
        const wrapper = document.getElementById('videoWrapper');
        wrapper.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; touchStartX = e.touches[0].clientX; }, { passive: true });
        wrapper.addEventListener('touchend', e => {
            const diffY = touchStartY - e.changedTouches[0].clientY;
            const diffX = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 50)
                diffY > 0 ? window.nextEpisode() : window.prevEpisode();
        }, { passive: true });
        let lastTap = 0;
        wrapper.addEventListener('touchend', e => {
            const now = Date.now(); if (now - lastTap < 300) window.toggleLike(); lastTap = now;
        });
    }

    function buildEpiGrid() {
        if (!currentStory) return;
        document.getElementById('epiNumberGrid').innerHTML = currentStory.episodes.map((epi, i) => `
            <button class="epi-num-btn ${i === currentEpiIndex ? 'playing' : ''}"
                    id="epi-num-${i}" onclick="selectEpisode(${i})" title="${epi.title}">${i + 1}</button>`).join('');
    }

    function updateEpiGridHighlight() {
        document.querySelectorAll('.epi-num-btn').forEach((el, i) => el.classList.toggle('playing', i === currentEpiIndex));
    }

    window.selectEpisode = function(index) { loadEpisode(index); history.back(); };

    window.openEpiPanel = function() {
        buildEpiGrid();
        document.getElementById('epiPanel').classList.add('open');
        document.getElementById('epiPanelOverlay').classList.add('active');
        pushState('epiPanel');
        setTimeout(() => {
            const el = document.getElementById('epi-num-' + currentEpiIndex);
            if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 300);
    };

    function closeEpiPanel() { document.getElementById('epiPanel').classList.remove('open'); document.getElementById('epiPanelOverlay').classList.remove('active'); }
    window.closeEpiPanelWithHistory = function() { history.back(); };

    document.addEventListener('keydown', e => {
        if (!document.getElementById('playerScreen').classList.contains('active')) return;
        if (e.key === 'Escape') history.back();
        if (e.key === ' ') { e.preventDefault(); window.togglePlayPause(); }
        if (e.key === 'ArrowRight') window.nextEpisode();
        if (e.key === 'ArrowLeft') window.prevEpisode();
    });

    document.addEventListener('visibilitychange', () => { if (document.hidden) document.getElementById('mainVideo').pause(); });

    init();
</script>
</body>
</html>
